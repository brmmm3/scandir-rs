[package]
name = "cxxscandir"
version = "4.0.1"
edition = "2024"
description = "C++ wrapper for scandir-rs using the cxx bridge"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
scandir = { version = "4.0.1", path = "../scandir" }

[build-dependencies]
cxx-build = "1.0"
