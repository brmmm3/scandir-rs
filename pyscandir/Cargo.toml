[package]
name = "scandir_rs"
version = "2.10.0"
authors = ["Martin Bammer <mrbm74@gmail.com>"]
description = "A fast file tree scanner written in Rust"
edition = "2024"
license = "MIT"
repository = "https://github.com/brmmm3/scandir-rs"
homepage = "https://github.com/brmmm3/scandir-rs"
readme = "README.md"
keywords = ["fast", "scandir", "walk"]
include = [
    "pyproject.toml",
    "src/*",
    "examples/*.py",
    "tests/*.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lib]
name = "scandir_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = [
    "extension-module",
    "generate-import-lib",
] }
speedy = { version = "0.8", optional = true }
bincode-next = { version = "3.1", features = [
    "derive",
    "serde",
], optional = true }
serde = { version = "1.0", optional = true }
serde_derive = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
#scandir = { version = "2.10.0" }
scandir = { path = "../scandir", version = "2.10.0" }

[features]
default = ["speedy", "bincode", "json"]
speedy = ["dep:speedy"]
bincode = ["dep:bincode-next", "dep:serde", "dep:serde_derive"]
json = ["dep:serde_json", "dep:serde", "dep:serde_derive"]
